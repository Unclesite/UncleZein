<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="maskableBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1526" />
      <stop offset="50%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#030508" />
    </linearGradient>
    <linearGradient id="blueGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3D72FE" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  
  <!-- Full bleed background for Android masking -->
  <rect width="512" height="512" fill="url(#maskableBg)" />
  
  <!-- Inner Safe Zone Iconography (within central 80%) -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#blueGradMask)" stroke-width="6" opacity="0.4" />
  
  <g transform="translate(0, 6)">
    <text x="256" y="290" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="130" 
          font-weight="900" 
          letter-spacing="-3"
          fill="url(#blueGradMask)" 
          text-anchor="middle">UZ</text>
  </g>

  <circle cx="256" cy="365" r="6" fill="#60a5fa" />
</svg>
