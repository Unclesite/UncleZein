<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1526" />
      <stop offset="50%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#030508" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3D72FE" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#3D72FE" stroke-opacity="0.3" stroke-width="4" />
  
  <!-- Inner Glow Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#blueGrad)" stroke-width="6" opacity="0.4" filter="url(#glow)" />
  
  <!-- Monogram UZ -->
  <g transform="translate(0, 8)">
    <text x="256" y="295" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="160" 
          font-weight="900" 
          letter-spacing="-4"
          fill="url(#blueGrad)" 
          text-anchor="middle"
          filter="url(#glow)">UZ</text>
  </g>

  <!-- Tagline / Accent Dot -->
  <circle cx="256" cy="385" r="7" fill="#60a5fa" />
</svg>
